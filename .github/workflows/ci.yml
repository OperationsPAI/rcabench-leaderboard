name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: rcabench-leaderboard validate-registry
      - run: rcabench-leaderboard build-site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: site/
